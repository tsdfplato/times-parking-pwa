name: Build Times Parking Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Missing repository secret: GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android-app/app/google-services.json
      - name: Restore Android signing key
        env:
          TIMES_KEYSTORE_BASE64: ${{ secrets.TIMES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TIMES_KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: TIMES_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$TIMES_KEYSTORE_BASE64" | base64 --decode > android-app/app/times-parking-release.jks
      - name: Build APK web screen
        run: |
          npm ci
          rm -rf android-app/app/src/main/assets/web
          VITE_ANDROID_ASSET=true npm run build
          mkdir -p android-app/app/src/main/assets/web
          cp -R dist/. android-app/app/src/main/assets/web/
      - name: Build signed release APK
        working-directory: android-app
        env:
          TIMES_KEYSTORE_FILE: times-parking-release.jks
          TIMES_KEYSTORE_PASSWORD: ${{ secrets.TIMES_KEYSTORE_PASSWORD }}
          TIMES_KEY_ALIAS: ${{ secrets.TIMES_KEY_ALIAS }}
          TIMES_KEY_PASSWORD: ${{ secrets.TIMES_KEY_PASSWORD }}
          TIMES_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: times-parking-android-release
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
