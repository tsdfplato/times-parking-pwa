name: Update Times parking status and deploy PWA

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: times-parking-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch parking status with retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Parking status fetch attempt ${attempt}/3"

            if node scripts/fetch-status.mjs; then
              echo "Parking status fetch succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Fetch failed. Retrying in 30 seconds."
              sleep 30
            fi
          done

          echo "Parking status fetch failed after 3 attempts"
          exit 1

      - name: Build PWA
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4